services:
  recommender:
    image: ghcr.io/inthushan23/projet-nlp-recommender:latest
    build:     
      context: .
      dockerfile: ./services/recommender_service/Dockerfile

    ports:
      - "8000:8000"
    volumes:
      - ./data:/data

  ui:
    image: ghcr.io/inthushan23/projet-nlp-ui:latest
    build: 
      context: .
      dockerfile: ./services/ui/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - recommender
    volumes:
      - ./data:/data